document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

utral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: %; background: var(--color-accent); display: grid; place-items: center;\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-bg)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 4 7v6c0 4 3.5 6 8 8 4.5-2 8-4 8-8V7z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n      <span style=\"font-family: var(--font-heading); font-size: 17px; white-space: nowrap;\">Course Studio<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; align-items: center; gap: 8px; color: color-mix(in srgb, var(--color-text) 55%, transparent); font-size: 13px; min-width: 0;\">\n      <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none;\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n      <span style=\"color: var(--color-text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">Bayes' theorem — the intuition<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"flex: 1;\"><\u002Fdiv>\n\n    <div style=\"display: flex; align-items: center; gap: 12px; padding: 5px 6px 5px 14px; border: 1px solid var(--color-divider); border-radius: 999px;\">\n      <span style=\"font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 50%, transparent);\">History<\u002Fspan>\n      <div style=\"display: flex; align-items: center; gap: 6px;\">\n        <sc-for list=\"{{ checkpoints }}\" as=\"cp\" hint-placeholder-count=\"2\">\n          <span title=\"{{ cp.label }}\" style=\"width: 9px; height: 9px; border-radius: 50%; background: {{ cp.dotBg }}; box-shadow: {{ cp.dotRing }};\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 62%, transparent); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ currentCheckpointLabel }}<\u002Fspan>\n      <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ revert }}\" disabled=\"{{ revertDisabled }}\" title=\"Revert last change\" style=\"font-size: 12px; padding: 5px 10px; gap: 5px;\">\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7v6h6\"><\u002Fpath><path d=\"M3 13a9 9 0 1 0 3-7.7L3 8\"><\u002Fpath><\u002Fsvg>\n        Revert\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <button class=\"btn\" sc-camel-on-click=\"{{ toggleInspect }}\" style=\"{{ inspectBtnStyle }}\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v3\"><\u002Fpath><path d=\"M12 18v3\"><\u002Fpath><path d=\"M3 12h3\"><\u002Fpath><path d=\"M18 12h3\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n      Inspect\n    <\u002Fbutton>\n  <\u002Fheader>\n\n  <div style=\"display: grid; grid-template-columns: {{ gridCols }}; min-height: 0; transition: grid-template-columns 0.28s ease;\">\n\n    <aside class=\"cs-scroll\" style=\"min-width: 0; border-right: 1px solid var(--color-divider); background: var(--color-bg); overflow-y: auto; padding: 22px 14px; display: flex; flex-direction: column; gap: 22px;\">\n      <div>\n        <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 45%, transparent); padding: 0 10px; margin-bottom: 10px;\">Course<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 9px; padding: 7px 10px;\">\n          <span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-2); flex: none;\"><\u002Fspan>\n          <span style=\"font-family: var(--font-heading); font-size: 15px; line-height: 1.2;\">Bayes' theorem — the intuition<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin: 4px 0 0 14px; padding-left: 14px; border-left: 1px solid var(--color-divider); display: flex; flex-direction: column; gap: 2px;\">\n          <sc-for list=\"{{ navSections }}\" as=\"ns\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ ns.go }}\" style=\"{{ ns.style }}\" style-hover=\"{{ ns.hover }}\">\n              <sc-if value=\"{{ ns.folded }}\" hint-placeholder-val=\"{{ false }}\">\n                <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none;\"><path d=\"m12 3 1.9 4.6L19 8.2l-3.6 3.3.9 5-4.3-2.5L7.7 16.5l.9-5L5 8.2l5.1-.6z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n              <span style=\"overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ ns.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 45%, transparent); padding: 0 10px; margin-bottom: 10px;\">Up next<\u002Fdiv>\n        <sc-for list=\"{{ lockedLessons }}\" as=\"ll\" hint-placeholder-count=\"2\">\n          <div style=\"display: flex; align-items: center; gap: 9px; padding: 7px 10px; color: color-mix(in srgb, var(--color-text) 42%, transparent);\">\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none;\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ ll }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"font-size: 11px; color: color-mix(in srgb, var(--color-text) 42%, transparent); padding: 6px 10px 0; line-height: 1.5;\">Written for you when you reach it.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <main ref=\"{{ stageRef }}\" style=\"position: relative; min-width: 0; overflow: hidden;\">\n      <div ref=\"{{ scrollRef }}\" class=\"cs-scroll\" style=\"position: absolute; inset: 0; overflow-y: auto; padding: 40px 0 120px; cursor: {{ stageCursor }};\">\n        <article ref=\"{{ courseRef }}\" class=\"cs-course\" style=\"width: min(720px, calc(100% - 96px)); margin: 0 auto; background: var(--color-neutral-100); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 56px 64px 64px;\">\n\n          <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 22px;\">\n            <span class=\"tag tag-accent-2\">Lesson 01<\u002Fspan>\n            <span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 50%, transparent);\">Probability · ~8 min · written for you<\u002Fspan>\n          <\u002Fdiv>\n\n          <h1 id=\"sec-intro\" style=\"font-size: 46px; line-height: 1.05; margin: 0 0 18px; max-width: 15ch;\">Why a positive test can still mean you're probably fine<\u002Fh1>\n\n          <p style=\"font-size: 18px; line-height: 1.7; max-width: 62ch; color: color-mix(in srgb, var(--color-text) 88%, transparent);\">A test is <em>90% accurate<\u002Fem>. You test positive. It feels obvious that you're 90% likely to have the thing. That intuition is wrong — often wildly so — and <strong>Bayes' theorem<\u002Fstrong> is the tool that tells you by how much.<\u002Fp>\n\n          <p style=\"font-size: 18px; line-height: 1.7; max-width: 62ch; color: color-mix(in srgb, var(--color-text) 88%, transparent);\">The missing ingredient is how <em>common<\u002Fem> the thing is to begin with — the <strong>prior<\u002Fstrong>. When something is rare, even a good test produces mostly false alarms. Play with it below.<\u002Fp>\n\n          <sc-for list=\"{{ edits }}\" as=\"ed\" hint-placeholder-count=\"0\">\n            <aside id=\"{{ ed.domId }}\" style=\"margin: 26px 0; padding: 22px 24px; background: var(--color-accent-2-100); border-radius: var(--radius-md);\">\n              <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 8px;\">\n                <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 3 1.9 4.6L19 8.2l-3.6 3.3.9 5-4.3-2.5L7.7 16.5l.9-5L5 8.2l5.1-.6z\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-2-700); font-weight: 700;\">{{ ed.kicker }} · folded in by your request<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"font-size: 22px; margin: 0 0 10px; color: var(--color-accent-2-900);\">{{ ed.title }}<\u002Fh3>\n              <sc-for list=\"{{ ed.paras }}\" as=\"pp\" hint-placeholder-count=\"0\">\n                <p style=\"font-size: 16px; line-height: 1.68; margin: 0 0 10px; color: color-mix(in srgb, var(--color-accent-2-900) 92%, transparent);\">{{ pp.t }}<\u002Fp>\n              <\u002Fsc-for>\n            <\u002Faside>\n          <\u002Fsc-for>\n\n          <figure id=\"sec-sim\" style=\"margin: 30px 0; padding: 26px; background: var(--color-bg); border-radius: var(--radius-lg);\">\n            <figcaption style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 18px; font-weight: 700;\">Interactive · the base-rate machine<\u002Ffigcaption>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px 26px;\">\n              <div style=\"grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px;\">\n                <span style=\"font-size: 13px; color: color-mix(in srgb, var(--color-text) 60%, transparent);\">A positive test really means:<\u002Fspan>\n                <span style=\"font-family: var(--font-heading); font-size: 40px; line-height: 1; color: var(--color-accent);\">{{ posteriorPct }}%<\u002Fspan>\n                <span style=\"font-size: 13px; color: color-mix(in srgb, var(--color-text) 60%, transparent);\">chance you have it<\u002Fspan>\n              <\u002Fdiv>\n\n              <label style=\"display: block;\">\n                <span style=\"display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 7px;\"><span>How common it is (prior)<\u002Fspan><strong style=\"color: var(--color-accent);\">{{ priorLabel }}<\u002Fstrong><\u002Fspan>\n                <input class=\"cs-range\" type=\"range\" min=\"0.5\" max=\"25\" step=\"0.5\" value=\"{{ sim.prior }}\" sc-camel-on-input=\"{{ onPrior }}\">\n              <\u002Flabel>\n              <label style=\"display: block;\">\n                <span style=\"display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 7px;\"><span>Test catches the sick (sensitivity)<\u002Fspan><strong style=\"color: var(--color-accent);\">{{ sensLabel }}<\u002Fstrong><\u002Fspan>\n                <input class=\"cs-range\" type=\"range\" min=\"50\" max=\"100\" step=\"1\" value=\"{{ sim.sens }}\" sc-camel-on-input=\"{{ onSens }}\">\n              <\u002Flabel>\n              <label style=\"display: block; grid-column: 1 / -1; max-width: calc(50% - 13px);\">\n                <span style=\"display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 7px;\"><span>False alarms on the healthy<\u002Fspan><strong style=\"color: var(--color-accent);\">{{ fprLabel }}<\u002Fstrong><\u002Fspan>\n                <input class=\"cs-range\" type=\"range\" min=\"0\" max=\"40\" step=\"1\" value=\"{{ sim.fpr }}\" sc-camel-on-input=\"{{ onFpr }}\">\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 24px;\">\n              <div style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 60%, transparent); margin-bottom: 6px;\">Everyone who tests positive<\u002Fdiv>\n              <div style=\"display: flex; height: 42px; border-radius: 10px; overflow: hidden; background: var(--color-neutral-300);\">\n                <div style=\"width: {{ truthWidth }}; background: var(--color-accent); display: grid; place-items: center; transition: width 0.18s ease; min-width: 2px;\">\n                  <span style=\"font-size: 12px; color: var(--color-bg); font-weight: 700; white-space: nowrap; padding: 0 6px;\">truly sick<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"flex: 1; background: var(--color-accent-2-400); display: grid; place-items: center;\">\n                  <span style=\"font-size: 12px; color: var(--color-accent-2-900); font-weight: 700; white-space: nowrap; padding: 0 6px;\">false alarm<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size: 15px; line-height: 1.6; margin: 14px 0 0; color: color-mix(in srgb, var(--color-text) 82%, transparent);\">Out of <strong>1,000 people<\u002Fstrong>: about <strong>{{ sickN }}<\u002Fstrong> are sick and <strong>{{ sickPos }}<\u002Fstrong> of them test positive — but <strong>{{ wellPos }}<\u002Fstrong> healthy people also test positive. That's <strong>{{ totalPos }}<\u002Fstrong> positives, only {{ sickPos }} of them real.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Ffigure>\n\n          <h2 id=\"sec-check\" style=\"font-size: 30px; margin: 34px 0 14px;\">Quick check<\u002Fh2>\n          <p style=\"font-size: 17px; line-height: 1.6; max-width: 60ch; margin-bottom: 16px;\">If the disease became <strong>ten times more common<\u002Fstrong>, the chance that a positive test is real would…<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 460px;\">\n            <sc-for list=\"{{ quizOptions }}\" as=\"q\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ q.pick }}\" style=\"{{ q.style }}\">\n                <span>{{ q.label }}<\u002Fspan>\n                <sc-if value=\"{{ q.showMark }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 12px; font-weight: 700;\">{{ q.mark }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ quizAnswered }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 14px 0 0; max-width: 60ch; color: var(--color-accent-2-700);\">{{ quizFeedback }}<\u002Fp>\n          <\u002Fsc-if>\n\n        <\u002Farticle>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasHover }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: absolute; top: {{ hoverTop }}; left: {{ hoverLeft }}; width: {{ hoverW }}; height: {{ hoverH }}; border: 2px solid var(--color-accent); background: color-mix(in srgb, var(--color-accent) 12%, transparent); border-radius: 6px; pointer-events: none; z-index: 20; box-shadow: 0 0 0 9999px color-mix(in srgb, var(--color-neutral-900) 8%, transparent);\"><\u002Fdiv>\n        <div style=\"position: absolute; top: {{ hoverLabelTop }}; left: {{ hoverLeft }}; transform: translateY(-100%); pointer-events: none; z-index: 21; background: var(--color-accent); color: var(--color-bg); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; white-space: nowrap; box-shadow: var(--shadow-md);\">{{ hoverLabel }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ inspectActive }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 22; display: flex; align-items: center; gap: 10px; background: var(--color-text); color: var(--color-bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow-lg);\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3.5\"><\u002Fcircle><path d=\"M12 3v3M12 18v3M3 12h3M18 12h3\"><\u002Fpath><\u002Fsvg>\n          Click any part of the lesson to attach it · <span style=\"opacity: 0.7;\">Esc to cancel<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n\n    <aside style=\"min-width: 0; border-left: 1px solid var(--color-divider); background: var(--color-surface); display: flex; flex-direction: column; min-height: 0; overflow: hidden;\">\n      <sc-if value=\"{{ chatOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; height: 100%; min-height: 0;\">\n\n          <div style=\"display: flex; align-items: center; gap: 8px; padding: 14px var(--space-4); border-bottom: 1px solid var(--color-divider);\">\n            <span style=\"width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-2); display: grid; place-items: center;\">\n              <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-bg)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 3 1.9 4.6L19 8.2l-3.6 3.3.9 5-4.3-2.5L7.7 16.5l.9-5L5 8.2l5.1-.6z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <span style=\"font-family: var(--font-heading); font-size: 16px;\">Design agent<\u002Fspan>\n            <span style=\"flex: 1;\"><\u002Fspan>\n            <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ toggleChat }}\" title=\"Collapse\" style=\"width: 30px; height: 30px;\">\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 6 6 6-6 6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <div ref=\"{{ msgRef }}\" class=\"cs-scroll\" style=\"flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: 16px; min-height: 0;\">\n            <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"1\">\n\n              <sc-if value=\"{{ m.isSystem }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"align-self: center; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent); background: var(--color-neutral-200); padding: 4px 12px; border-radius: 999px;\">\n                  <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7v6h6\"><\u002Fpath><path d=\"M3 13a9 9 0 1 0 3-7.7L3 8\"><\u002Fpath><\u002Fsvg>\n                  {{ m.text }}\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ m.isUser }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"align-self: flex-end; max-width: 88%; display: flex; flex-direction: column; align-items: flex-end; gap: 7px;\">\n                  <sc-for list=\"{{ m.chips }}\" as=\"ch\" hint-placeholder-count=\"0\">\n                    <div style=\"display: flex; align-items: center; gap: 8px; background: var(--color-neutral-100); border: 1px solid var(--color-divider); border-radius: 12px; padding: 6px 8px; max-width: 260px;\">\n                      <span style=\"flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--color-accent-2-200); color: var(--color-accent-2-800); display: grid; place-items: center; font-size: 10px; font-weight: 700; font-family: var(--font-heading);\">{{ ch.tag }}<\u002Fspan>\n                      <span style=\"font-size: 12px; line-height: 1.35; color: color-mix(in srgb, var(--color-text) 75%, transparent); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;\">{{ ch.text }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"background: var(--color-accent); color: var(--color-bg); padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.5;\">{{ m.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ m.isAgent }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"align-self: flex-start; max-width: 92%; display: flex; flex-direction: column; gap: 8px;\">\n                  <sc-if value=\"{{ m.hasActivity }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; background: var(--color-accent-2-100); border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 12px; color: var(--color-accent-2-800);\">\n                      <sc-if value=\"{{ m.activityDone }}\" hint-placeholder-val=\"{{ false }}\">\n                        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ m.activitySpin }}\" hint-placeholder-val=\"{{ true }}\">\n                        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" style=\"animation: cs-spin 0.8s linear infinite;\"><path d=\"M21 12a9 9 0 1 1-6.2-8.5\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fsc-if>\n                      <span>{{ m.activityLabel }}<\u002Fspan>\n                      <span style=\"font-family: ui-monospace, monospace; color: var(--color-accent-2-900); font-size: 11px;\">{{ m.activityFile }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ m.hasText }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"background: var(--color-neutral-100); padding: 11px 15px; border-radius: 4px 16px 16px 16px; font-size: 14px; line-height: 1.6;\">{{ m.text }}<sc-if value=\"{{ m.streaming }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"cs-caret\"><\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ m.hasProfile }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display: flex; align-items: center; gap: 7px; align-self: flex-start; font-size: 12px; color: var(--color-accent-2-700); padding-left: 4px;\">\n                      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 4 7v6c0 4 3.5 6 8 8 4.5-2 8-4 8-8V7z\"><\u002Fpath><\u002Fsvg>\n                      <span>{{ m.profileText }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"padding: 12px var(--space-4) 16px; border-top: 1px solid var(--color-divider);\">\n            <sc-if value=\"{{ hasChips }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;\">\n                <sc-for list=\"{{ chips }}\" as=\"ch\" hint-placeholder-count=\"0\">\n                  <div style=\"display: flex; align-items: center; gap: 7px; background: var(--color-neutral-100); border: 1px solid var(--color-accent-300); border-radius: 12px; padding: 5px 6px; max-width: 240px;\">\n                    <span style=\"flex: none; width: 24px; height: 24px; border-radius: 6px; background: var(--color-accent-2-200); color: var(--color-accent-2-800); display: grid; place-items: center; font-size: 10px; font-weight: 700; font-family: var(--font-heading);\">{{ ch.tag }}<\u002Fspan>\n                    <span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 72%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px;\">{{ ch.text }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ ch.expand }}\" title=\"Select parent\" style=\"border: none; background: transparent; cursor: pointer; color: var(--color-accent-700); display: grid; place-items: center; padding: 2px;\">\n                      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m18 15-6-6-6 6\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ ch.remove }}\" title=\"Remove\" style=\"border: none; background: transparent; cursor: pointer; color: color-mix(in srgb, var(--color-text) 45%, transparent); display: grid; place-items: center; padding: 2px;\">\n                      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display: flex; align-items: flex-end; gap: 8px; background: var(--color-neutral-100); border: 1px solid var(--color-divider); border-radius: var(--radius-md); padding: 8px 8px 8px 14px;\">\n              <textarea ref=\"{{ inputRef }}\" value=\"{{ composer }}\" sc-camel-on-input=\"{{ onComposer }}\" sc-camel-on-key-down=\"{{ onComposerKey }}\" placeholder=\"{{ composerPlaceholder }}\" rows=\"1\" style=\"flex: 1; border: none; background: transparent; resize: none; font: inherit; font-size: 14px; line-height: 1.5; color: var(--color-text); outline: none; max-height: 120px; padding: 4px 0;\"><\u002Ftextarea>\n              <button class=\"btn btn-primary btn-icon\" sc-camel-on-click=\"{{ send }}\" disabled=\"{{ sendDisabled }}\" title=\"Send\" style=\"width: 34px; height: 34px; flex: none;\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 14-6-6 14-2-6z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size: 11px; color: color-mix(in srgb, var(--color-text) 45%, transparent); margin-top: 8px; text-align: center;\">Answers land in the lesson. The chat is for steering.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ chatClosed }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ toggleChat }}\" title=\"Open chat\" style=\"width: 100%; height: 100%; border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 18px; color: var(--color-accent);\">\n          <span style=\"width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-2); display: grid; place-items: center;\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-bg)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"writing-mode: vertical-rl; font-family: var(--font-heading); font-size: 14px; color: var(--color-text); letter-spacing: 0.02em;\">Design agent<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Faside>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.stageRef = React.createRef();\n    this.scrollRef = React.createRef();\n    this.courseRef = React.createRef();\n    this.msgRef = React.createRef();\n    this.inputRef = React.createRef();\n    this.uid = 0;\n    this.timers = [];\n    this.state = {\n      chatOpen: true,\n      inspect: false,\n      alt: false,\n      chips: [],\n      composer: \"\",\n      sim: { prior: 1, sens: 90, fpr: 9 },\n      quiz: null,\n      hover: null,\n      activeSection: \"sec-intro\",\n      working: false,\n      profileNoted: false,\n      turn: 0,\n      edits: [],\n      messages: [\n        { id: \"m0\", role: \"agent\", text: \"Your Bayes' theorem lesson is ready \\u2014 read it, drag the sliders, take the check. Anything confusing, too fast, or too abstract? Hit \\u201cInspect,\\u201d click that part of the lesson, and tell me. I'll fold the fix straight into the page.\", streaming: false },\n      ],\n      checkpoints: [\n        { id: \"c0\", label: \"Course created\" },\n        { id: \"c1\", label: \"Simulator added\" },\n      ],\n    };\n    this.EDITS = [\n      { kicker: \"Worked example\", title: \"A rare disease, in real numbers\", paras: [\n        \"Picture 1,000 people screened. If 1% truly have the disease, that's 10 sick and 990 healthy.\",\n        \"The test catches 9 of the 10 sick people. But at a 9% false-alarm rate it also flags about 89 of the healthy ones.\",\n        \"So ~98 people test positive \\u2014 and only 9 are actually sick. A positive result is closer to a 1-in-10 chance than 9-in-10. The rarity of the disease drowns out the test's accuracy.\" ] },\n      { kicker: \"Intuition\", title: \"Why the prior wins\", paras: [\n        \"Your gut hears \\u201c90% accurate\\u201d and assumes a positive test is 90% trustworthy. Bayes says to start somewhere else: how common the thing is in the first place.\",\n        \"When the prior is tiny, the pool of true cases is tiny too \\u2014 so even a small slice of the huge healthy group can outnumber every real case.\" ] },\n      { kicker: \"Another angle\", title: \"The spam-filter version\", paras: [\n        \"The same math runs your inbox. A filter that's 99% accurate still buries you in false flags if almost none of your mail is actually spam.\",\n        \"Flip it \\u2014 when spam is common, the very same filter feels reliable. The accuracy never changed. The base rate did.\" ] },\n    ];\n    this.REPLIES = [\n      \"Folded a worked example in right under the intro \\u2014 1,000 people with real counts, so the number isn't just a formula. Skim it and tell me if it should be your field instead of a disease.\",\n      \"Added a short note on why the prior dominates, next to the example. Kept it to two sentences \\u2014 say the word to expand it.\",\n      \"Dropped in a spam-filter version of the same idea, further down. Sometimes a second domain is what makes it click.\",\n    ];\n    this.CHK_LABELS = [\"Added worked example\", \"Added prior note\", \"Added spam analogy\"];\n  }\n\n  componentDidMount() {\n    const sc = this.scrollRef.current;\n    if (sc) {\n      sc.addEventListener(\"mousemove\", this.onMove);\n      sc.addEventListener(\"mouseleave\", this.onLeave);\n      sc.addEventListener(\"click\", this.onPick, true);\n      sc.addEventListener(\"scroll\", this.onScroll);\n    }\n    window.addEventListener(\"keydown\", this.onKey);\n    window.addEventListener(\"keyup\", this.onKeyUp);\n  }\n  componentWillUnmount() {\n    this.timers.forEach(clearTimeout);\n    window.removeEventListener(\"keydown\", this.onKey);\n    window.removeEventListener(\"keyup\", this.onKeyUp);\n  }\n\n  after(ms, fn) { const t = setTimeout(fn, ms); this.timers.push(t); return t; }\n  inspectActive() { return this.state.inspect || this.state.alt; }\n\n  onKey = (e) => {\n    if (e.key === \"Alt\" && !this.state.alt) this.setState({ alt: true });\n    if (e.key === \"Escape\") this.setState({ inspect: false, alt: false, hover: null });\n  };\n  onKeyUp = (e) => { if (e.key === \"Alt\") this.setState({ alt: false, hover: null }); };\n\n  validTarget(el) {\n    const root = this.courseRef.current;\n    if (!el || !root || !root.contains(el) || el === root) return null;\n    if (el.closest(\"input, .cs-range\")) return el.closest(\"label\") || el;\n    return el;\n  }\n\n  onMove = (e) => {\n    if (!this.inspectActive()) { if (this.state.hover) this.setState({ hover: null }); return; }\n    const el = this.validTarget(e.target);\n    if (!el) return;\n    const st = this.stageRef.current.getBoundingClientRect();\n    const r = el.getBoundingClientRect();\n    this.setState({ hover: {\n      top: (r.top - st.top) + \"px\",\n      left: (r.left - st.left) + \"px\",\n      w: r.width + \"px\",\n      h: r.height + \"px\",\n      labelTop: (r.top - st.top - 4) + \"px\",\n      label: \"<\" + el.tagName.toLowerCase() + \">  \" + Math.round(r.width) + \"\\u00d7\" + Math.round(r.height),\n    } });\n  };\n  onLeave = () => { if (this.state.hover) this.setState({ hover: null }); };\n\n  navAnchorIds() { return [\"sec-intro\", ...this.state.edits.map((e) => e.domId), \"sec-sim\", \"sec-check\"]; }\n  scrollToSection(id) {\n    const n = document.getElementById(id), sc = this.scrollRef.current;\n    if (n && sc) sc.scrollTo({ top: Math.max(0, n.offsetTop - 40), behavior: \"smooth\" });\n  }\n  onScroll = () => {\n    if (this.state.hover) this.setState({ hover: null });\n    const sc = this.scrollRef.current;\n    if (!sc) return;\n    const y = sc.scrollTop + 110;\n    const ids = this.navAnchorIds();\n    let act = ids[0];\n    for (const id of ids) { const n = document.getElementById(id); if (n && n.offsetTop <= y) act = id; }\n    if (act !== this.state.activeSection) this.setState({ activeSection: act });\n  };\n\n  onPick = (e) => {\n    if (!this.inspectActive()) return;\n    e.preventDefault(); e.stopPropagation();\n    const el = this.validTarget(e.target);\n    if (!el) return;\n    this.addChip(el);\n    this.setState({ inspect: false, hover: null });\n    this.after(30, () => this.inputRef.current && this.inputRef.current.focus());\n  };\n\n  chipFrom(el) {\n    const tag = el.tagName.toLowerCase();\n    let text = (el.innerText || el.textContent || \"\").replace(/\\s+/g, \" \").trim();\n    if (!text) text = \"(\" + tag + \" element)\";\n    return { id: \"chip\" + (++this.uid), tag, text: text.slice(0, 90), el };\n  }\n  addChip(el) {\n    const chip = this.chipFrom(el);\n    this.setState((s) => ({ chips: [...s.chips.filter((c) => c.el !== el), chip] }));\n  }\n  removeChip(id) { this.setState((s) => ({ chips: s.chips.filter((c) => c.id !== id) })); }\n  expandChip(id) {\n    this.setState((s) => ({ chips: s.chips.map((c) => {\n      if (c.id !== id) return c;\n      const p = c.el.parentElement;\n      if (!p || !this.courseRef.current.contains(p) || p === this.courseRef.current) return c;\n      const n = this.chipFrom(p); n.id = c.id; return n;\n    }) }));\n  }\n\n  toggleChat = () => this.setState((s) => ({ chatOpen: !s.chatOpen }));\n  toggleInspect = () => this.setState((s) => ({ inspect: !s.inspect, hover: null }));\n\n  setSim(k, v) { this.setState((s) => ({ sim: { ...s.sim, [k]: Number(v) } })); }\n  pickQuiz(v) { this.setState({ quiz: v }); }\n\n  onComposer = (e) => {\n    this.setState({ composer: e.target.value });\n    const el = e.target; el.style.height = \"auto\"; el.style.height = Math.min(el.scrollHeight, 120) + \"px\";\n  };\n  onComposerKey = (e) => { if (e.key === \"Enter\" && !e.shiftKey) { e.preventDefault(); this.send(); } };\n\n  scrollChat() { this.after(20, () => { const m = this.msgRef.current; if (m) m.scrollTop = m.scrollHeight; }); }\n\n  patchMsg(id, patch) {\n    this.setState((s) => ({ messages: s.messages.map((m) => m.id === id ? { ...m, ...patch } : m) }));\n  }\n\n  revealEdit() {\n    const idx = this.state.turn;\n    const base = this.EDITS[idx];\n    let ed;\n    if (base) ed = { ...base };\n    else {\n      const snip = (this.lastChipText || \"that part\").slice(0, 40);\n      ed = { kicker: \"Clarified\", title: \"A closer look at \\u201c\" + snip + \"\\u201d\", paras: [\n        \"Reworded this to stay concrete and tied it back to the base-rate idea, so it reads in one pass.\",\n        \"If it's still off, select it again and tell me what's tripping you up.\" ] };\n    }\n    const domId = \"cs-edit-\" + (++this.uid);\n    ed.domId = domId;\n    const label = this.CHK_LABELS[idx] || \"Clarified selection\";\n    this.setState((s) => ({\n      edits: [...s.edits, ed],\n      checkpoints: [...s.checkpoints, { id: \"c\" + this.uid, label }],\n    }));\n    this.after(60, () => {\n      const node = document.getElementById(domId);\n      const sc = this.scrollRef.current;\n      if (node && sc) {\n        sc.scrollTo({ top: node.offsetTop - 60, behavior: \"smooth\" });\n        node.animate([\n          { boxShadow: \"0 0 0 4px var(--color-accent)\", offset: 0 },\n          { boxShadow: \"0 0 0 4px color-mix(in srgb, var(--color-accent) 0%, transparent)\", offset: 1 },\n        ], { duration: 1400, easing: \"ease-out\" });\n      }\n    });\n  }\n\n  streamInto(id, text, done) {\n    const words = text.split(\" \");\n    let i = 0;\n    const step = () => {\n      i += 1;\n      this.patchMsg(id, { text: words.slice(0, i).join(\" \"), streaming: i < words.length });\n      this.scrollChat();\n      if (i < words.length) this.after(28, step);\n      else done && done();\n    };\n    step();\n  }\n\n  send() {\n    const text = this.state.composer.trim();\n    const chips = this.state.chips;\n    if ((!text && chips.length === 0) || this.state.working) return;\n    this.lastChipText = chips.length ? chips[chips.length - 1].text : \"\";\n    const turn = this.state.turn;\n\n    const uMsg = { id: \"u\" + (++this.uid), role: \"user\", text: text || \"Explain this differently.\", chips: chips.map((c) => ({ tag: c.tag, text: c.text })) };\n    const aid = \"a\" + (++this.uid);\n    const aMsg = { id: aid, role: \"agent\", text: \"\", streaming: false, activity: { label: \"Reading your selection\\u2026\", file: \"bayes-intuition.html\", done: false }, profile: null };\n\n    this.setState((s) => ({ messages: [...s.messages, uMsg, aMsg], chips: [], composer: \"\", working: true }));\n    if (this.inputRef.current) this.inputRef.current.style.height = \"auto\";\n    this.scrollChat();\n\n    this.after(750, () => this.patchMsg(aid, { activity: { label: \"Editing\", file: \"bayes-intuition.html\", done: false } }));\n    this.after(1250, () => this.revealEdit());\n    this.after(1450, () => {\n      this.patchMsg(aid, { activity: { label: \"Edited\", file: \"bayes-intuition.html\", done: true } });\n      this.streamInto(aid, this.REPLIES[turn] || \"Added a clarification on that in the lesson and kept it concrete.\", () => {\n        const patch = { streaming: false };\n        if (!this.state.profileNoted) {\n          patch.profile = \"Noted in your profile: learns best from concrete numbers before formulas.\";\n          this.setState({ profileNoted: true });\n        }\n        this.patchMsg(aid, patch);\n        this.setState((s) => ({ working: false, turn: s.turn + 1 }));\n        this.scrollChat();\n      });\n    });\n  }\n\n  revert() {\n    if (this.state.checkpoints.length <= 2) return;\n    const removed = this.state.checkpoints[this.state.checkpoints.length - 1];\n    const prev = this.state.checkpoints[this.state.checkpoints.length - 2];\n    this.setState((s) => ({\n      checkpoints: s.checkpoints.slice(0, -1),\n      edits: s.edits.slice(0, -1),\n      turn: Math.max(0, s.turn - 1),\n      profileNoted: s.turn - 1 <= 0 ? false : s.profileNoted,\n      messages: [...s.messages, { id: \"sys\" + (++this.uid), role: \"system\", text: \"Reverted \\u201c\" + removed.label + \"\\u201d \\u2014 back to \\u201c\" + prev.label + \"\\u201d\" }],\n    }));\n    this.scrollChat();\n  }\n\n  renderVals() {\n    const s = this.state;\n    const sim = s.sim;\n    const prior = sim.prior / 100, sens = sim.sens / 100, fpr = sim.fpr / 100;\n    const pPos = prior * sens + (1 - prior) * fpr;\n    const post = pPos > 0 ? (prior * sens) / pPos : 0;\n    const postPct = post * 100;\n    const active = this.inspectActive();\n\n    const dot = (i) => {\n      const isLast = i === s.checkpoints.length - 1;\n      return {\n        ...s.checkpoints[i],\n        dotBg: isLast ? \"var(--color-accent)\" : \"var(--color-neutral-400)\",\n        dotRing: isLast ? \"0 0 0 3px color-mix(in srgb, var(--color-accent) 28%, transparent)\" : \"none\",\n      };\n    };\n\n    const quizDefs = [\n      { v: \"up\", label: \"Go up \\u2014 more positives are real\" },\n      { v: \"same\", label: \"Stay the same \\u2014 the test didn't change\" },\n      { v: \"down\", label: \"Go down\" },\n    ];\n    const quizOptions = quizDefs.map((q) => {\n      const picked = s.quiz === q.v;\n      const correct = q.v === \"up\";\n      let bg = \"var(--color-neutral-100)\", bd = \"var(--color-divider)\", col = \"var(--color-text)\";\n      if (s.quiz) {\n        if (correct) { bg = \"var(--color-accent-2-100)\"; bd = \"var(--color-accent-2-400)\"; col = \"var(--color-accent-2-900)\"; }\n        else if (picked) { bg = \"var(--color-accent-100)\"; bd = \"var(--color-accent-300)\"; }\n      }\n      return {\n        label: q.label,\n        pick: () => this.pickQuiz(q.v),\n        style: \"display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font:inherit;font-size:15px;cursor:pointer;padding:13px 16px;border-radius:14px;border:1.5px solid \" + bd + \";background:\" + bg + \";color:\" + col + \";transition:all .15s ease;\",\n        showMark: !!s.quiz && (correct || picked),\n        mark: correct ? \"\\u2713 correct\" : (picked ? \"not quite\" : \"\"),\n      };\n    });\n\n    return {\n      gridCols: s.chatOpen ? \"236px 1fr 384px\" : \"236px 1fr 52px\",\n\n      lockedLessons: [\"Naive Bayes classifiers\", \"Priors in the wild\"],\n      navSections: [\n        { id: \"sec-intro\", label: \"Introduction\", folded: false },\n        ...s.edits.map((e) => ({ id: e.domId, label: e.title, folded: true })),\n        { id: \"sec-sim\", label: \"The base-rate machine\", folded: false },\n        { id: \"sec-check\", label: \"Quick check\", folded: false },\n      ].map((ns) => {\n        const on = s.activeSection === ns.id;\n        return {\n          label: ns.label,\n          folded: ns.folded,\n          go: () => this.scrollToSection(ns.id),\n          hover: on ? \"\" : \"background: color-mix(in srgb, var(--color-text) 6%, transparent);\",\n          style: \"display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;cursor:pointer;font:inherit;font-size:13px;line-height:1.35;padding:7px 10px;border-radius:10px;transition:background .15s ease,color .15s ease;background:\" + (on ? \"var(--color-accent-100)\" : \"transparent\") + \";color:\" + (on ? \"var(--color-accent-800)\" : \"color-mix(in srgb, var(--color-text) 78%, transparent)\") + \";font-weight:\" + (on ? \"700\" : \"400\") + \";\",\n        };\n      }),\n      chatOpen: s.chatOpen,\n      chatClosed: !s.chatOpen,\n      toggleChat: this.toggleChat,\n\n      stageRef: this.stageRef, scrollRef: this.scrollRef, courseRef: this.courseRef, msgRef: this.msgRef, inputRef: this.inputRef,\n\n      inspectActive: active,\n      stageCursor: active ? \"crosshair\" : \"auto\",\n      toggleInspect: this.toggleInspect,\n      inspectBtnStyle: \"gap:7px;font-size:14px;padding:8px 16px;border:1px solid \" + (active ? \"var(--color-accent)\" : \"var(--color-divider)\") + \";background:\" + (active ? \"var(--color-accent)\" : \"transparent\") + \";color:\" + (active ? \"var(--color-bg)\" : \"var(--color-text)\") + \";\",\n\n      hasHover: !!s.hover,\n      hoverTop: s.hover ? s.hover.top : \"0\",\n      hoverLeft: s.hover ? s.hover.left : \"0\",\n      hoverW: s.hover ? s.hover.w : \"0\",\n      hoverH: s.hover ? s.hover.h : \"0\",\n      hoverLabelTop: s.hover ? s.hover.labelTop : \"0\",\n      hoverLabel: s.hover ? s.hover.label : \"\",\n\n      checkpoints: s.checkpoints.map((_, i) => dot(i)),\n      currentCheckpointLabel: s.checkpoints[s.checkpoints.length - 1].label,\n      revert: () => this.revert(),\n      revertDisabled: s.checkpoints.length <= 2,\n\n      edits: s.edits.map((e) => ({ ...e, paras: e.paras.map((t) => ({ t })) })),\n\n      posteriorPct: postPct.toFixed(1),\n      priorLabel: sim.prior + \"%\",\n      sensLabel: sim.sens + \"%\",\n      fprLabel: sim.fpr + \"%\",\n      sim,\n      onPrior: (e) => this.setSim(\"prior\", e.target.value),\n      onSens: (e) => this.setSim(\"sens\", e.target.value),\n      onFpr: (e) => this.setSim(\"fpr\", e.target.value),\n      truthWidth: Math.max(postPct, 1.5).toFixed(1) + \"%\",\n      sickN: Math.round(prior * 1000),\n      sickPos: Math.round(prior * sens * 1000),\n      wellPos: Math.round((1 - prior) * fpr * 1000),\n      totalPos: Math.round(prior * sens * 1000) + Math.round((1 - prior) * fpr * 1000),\n\n      quizOptions,\n      quizAnswered: !!s.quiz,\n      quizFeedback: s.quiz === \"up\"\n        ? \"Right. A bigger prior means more genuinely sick people, so the same test produces a higher share of true positives \\u2014 the base rate does the heavy lifting, not the accuracy.\"\n        : \"Actually it goes up: making the disease more common enlarges the pool of true cases, so a larger share of positives are real. The prior drives the answer.\",\n\n      messages: s.messages.map((m) => ({\n        id: m.id,\n        isUser: m.role === \"user\",\n        isAgent: m.role === \"agent\",\n        isSystem: m.role === \"system\",\n        text: m.text,\n        chips: m.chips || [],\n        streaming: !!m.streaming,\n        hasText: (m.text && m.text.length > 0) || m.role === \"user\",\n        hasActivity: !!m.activity,\n        activityLabel: m.activity ? m.activity.label : \"\",\n        activityFile: m.activity ? m.activity.file : \"\",\n        activityDone: m.activity ? m.activity.done : false,\n        activitySpin: m.activity ? !m.activity.done : false,\n        hasProfile: !!m.profile,\n        profileText: m.profile || \"\",\n      })),\n\n      chips: s.chips.map((c) => ({ tag: c.tag, text: c.text, remove: () => this.removeChip(c.id), expand: () => this.expandChip(c.id) })),\n      hasChips: s.chips.length > 0,\n      composer: s.composer,\n      onComposer: this.onComposer,\n      onComposerKey: this.onComposerKey,\n      composerPlaceholder: s.chips.length ? \"What should I change about this?\" : \"Ask the agent, or inspect a part of the lesson\\u2026\",\n      send: () => this.send(),\n      sendDisabled: (!s.composer.trim() && s.chips.length === 0) || s.working,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
