<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New course</title>
    <style>
      :root { color: #201e1d; background: #f9f4ed; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; min-height: 100vh; place-items: center; padding: 42px; background: #f9f4ed; }
      main { display: flex; align-items: center; gap: 12px; color: rgba(32, 30, 29, .58); font-size: 14px; }
      .spinner { width: 18px; height: 18px; border: 2px solid rgba(122, 138, 94, .25); border-top-color: #7a8a5e; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body data-course-studio-empty>
    <main><span class="spinner" aria-hidden="true"></span> Designing your course…</main>
  </body>
</html>
