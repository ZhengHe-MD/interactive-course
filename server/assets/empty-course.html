<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New course</title>
    <style>
      :root { color: #28231f; background: #f7efe3; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; min-height: 100vh; place-items: center; padding: 42px; background: radial-gradient(circle at 50% 42%, #fffaf1 0, #f7efe3 48%, #eee0ca 100%); }
      main { width: min(650px, 100%); text-align: center; }
      .mark { display: grid; width: 64px; height: 64px; margin: 0 auto 30px; place-items: center; border: 1px solid rgba(113, 91, 66, .18); border-radius: 22px; background: rgba(255, 250, 242, .76); color: #c67139; box-shadow: 0 12px 35px rgba(74, 54, 34, .09); }
      .mark svg { width: 28px; }
      .eyebrow { color: #985329; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 580px; margin: 16px auto 20px; font: 500 clamp(42px, 6vw, 68px)/.98 Georgia, serif; letter-spacing: -.055em; text-wrap: balance; }
      .intro { max-width: 510px; margin: 0 auto; color: #71675d; font-size: 16px; line-height: 1.65; text-wrap: balance; }
      .start { display: inline-flex; align-items: center; gap: 10px; margin-top: 36px; padding: 12px 17px; border: 1px solid rgba(113, 91, 66, .18); border-radius: 14px; background: rgba(255, 250, 242, .8); color: #5b5047; font-family: inherit; font-size: 13px; font-weight: 700; line-height: 1.2; box-shadow: 0 8px 26px rgba(74, 54, 34, .07); cursor: pointer; }
      .start:hover { border-color: rgba(198, 113, 57, .38); background: #fffaf2; transform: translateY(-1px); }
      .start:focus-visible { outline: 2px solid #c67139; outline-offset: 3px; }
      .start span { color: #c67139; font-size: 18px; }
      .promise { margin-top: 52px; color: #a09385; font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; text-transform: uppercase; }
      @media (max-width: 560px) { body { padding: 26px; } h1 { font-size: 43px; } .intro { font-size: 14px; } }
    </style>
  </head>
  <body data-course-studio-empty>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4" /></svg>
      </div>
      <div class="eyebrow">A new course</div>
      <h1>What would you like to learn today?</h1>
      <p class="intro">Bring a question, a skill, or a curiosity. We’ll shape the goal together, then build your course from a blank page.</p>
      <button class="start" type="button" data-course-studio-start>Start in the Course agent <span>→</span></button>
      <div class="promise">No syllabus yet · No template · Built from your answers</div>
    </main>
  </body>
</html>
